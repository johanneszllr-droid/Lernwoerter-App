name: Publish dev to main/dev

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: dev-repo
          fetch-depth: 0

      - name: Sync dev into main/dev
        run: |
          rm -rf main-repo/dev
          mkdir -p main-repo/dev
          cp -r dev-repo/. main-repo/dev/
          rm -rf main-repo/dev/.git main-repo/dev/.github

      - name: Generate build metadata
        run: |
          commit_hash="$(git -C dev-repo rev-parse --short=12 HEAD)"
          commit_name="$(git -C dev-repo log -1 --format=%s)"
          version_tag="$(git -C dev-repo describe --tags --exact-match HEAD 2>/dev/null || true)"
          if [ -n "$version_tag" ]; then
            version="${version_tag#v}"
          else
            version="0.0.0-dev+${commit_hash}"
          fi
          jq -n \
            --arg version "$version" \
            --arg commitName "$commit_name" \
            --arg commitHash "$commit_hash" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, commitName: $commitName, commitHash: $commitHash, builtAt: $builtAt}' \
            > main-repo/dev/build-info.json

      - name: Commit and push to main
        run: |
          cd main-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev
          git diff --staged --quiet || git commit -m "Deploy dev preview to /dev"
          git push origin main
