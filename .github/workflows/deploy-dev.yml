name: Publish dev to main/dev

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-repo

      - name: Sync dev into main/dev
        run: |
          rm -rf main-repo/dev
          mkdir -p main-repo/dev
          cp -r dev-repo/. main-repo/dev/
          rm -rf main-repo/dev/.git main-repo/dev/.github

      - name: Commit and push to main
        run: |
          cd main-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev
          git diff --staged --quiet || git commit -m "Deploy dev preview to /dev"
          git push origin main
